<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم للمسابقة</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --primary: #46178f; --white: #ffffff; }
        body { font-family: sans-serif; background-color: var(--primary); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .logo { font-size: 2rem; font-weight: bold; color: var(--primary); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 5px; box-sizing: border-box; text-align: center; font-size: 1.1rem; }
        button { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
        button:hover { background: #000; }
        .waiting-msg { color: var(--primary); font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="box" id="join-box">
        <div class="logo">QUIZ GAME</div>
        <input type="text" id="nickname" placeholder="أدخل اسمك المستعار">
        <button onclick="join()">انضم الآن</button>
    </div>

    <div class="box" id="waiting-box" style="display:none;">
        <div class="logo">مرحباً بك!</div>
        <p class="waiting-msg" style="display:block;">أنت متصل الآن.. انتظر بدء المعلم للمسابقة</p>
    </div>

    <script>
        const socket = io();
        function join() {
            const name = document.getElementById('nickname').value;
            if(name) {
                socket.emit('joinGame', { name: name });
                document.getElementById('join-box').style.display = 'none';
                document.getElementById('waiting-box').style.display = 'block';
            } else { alert("من فضلك أدخل اسمك"); }
        }

        socket.on('receiveQuestion', (data) => {
            // عند استقبال سؤال، يتم تحويل الشاشة لأزرار إجابة فقط
            document.body.innerHTML = `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:95%; height:90vh; padding:10px;">
                    <div onclick="sendAns(0)" style="background:#e21b3c; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:3rem; color:white;">▲</div>
                    <div onclick="sendAns(1)" style="background:#1368ce; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:3rem; color:white;">◆</div>
                    <div onclick="sendAns(2)" style="background:#d89e00; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:3rem; color:white;">●</div>
                    <div onclick="sendAns(3)" style="background:#26890c; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:3rem; color:white;">■</div>
                </div>`;
        });

        function sendAns(idx) {
            socket.emit('submitAnswer', { answerIndex: idx });
            document.body.innerHTML = `<h1 style="color:white; text-align:center;">تم إرسال الإجابة! انتظر النتيجة...</h1>`;
        }
    </script>
</body>
</html>
